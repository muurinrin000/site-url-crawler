name: Site URL Collector
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL"
        required: true
        default: "https://www.insource.co.jp/"
        type: string
      collection_mode:
        description: "Collection mode"
        required: true
        default: "AUTO"
        type: choice
        options: [AUTO, XML_ONLY, HTML_CRAWL]
      output_mode:
        description: "Output mode"
        required: true
        default: "URL_ONLY"
        type: choice
        options: [URL_ONLY, DETAIL]
      concurrency:
        description: "同時処理数（推奨6）"
        required: true
        default: "6"
        type: string
      requests_per_second:
        description: "1秒あたりの最大アクセス数（推奨1.5）"
        required: true
        default: "1.5"
        type: string
      fresh_start:
        description: "以前のデータを消して最初から収集する"
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: site-url-crawler
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: "pip"}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect URLs
        env:
          TARGET_URL: ${{ inputs.target_url }}
          COLLECTION_MODE: ${{ inputs.collection_mode }}
          OUTPUT_MODE: ${{ inputs.output_mode }}
          CONCURRENCY: ${{ inputs.concurrency }}
          REQUESTS_PER_SECOND: ${{ inputs.requests_per_second }}
        run: |
          if [ "${{ inputs.fresh_start }}" = "true" ]; then python -u crawler.py --fresh; else python -u crawler.py; fi
      - name: Upload Excel / CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-url-output-${{ github.run_number }}
          path: |
            output/*.xlsx
            output/*.csv
          if-no-files-found: warn
          retention-days: 7
      - name: Save crawl state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "No state changes."; else git commit -m "chore: save crawler state [skip ci]" && git push; fi
